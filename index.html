<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EMBERDECK — a dungeon deck-crawler</title>
<link rel="stylesheet" href="src/ui/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-left">
      <span class="logo">EMBER<span class="logo-accent">DECK</span></span>
    </div>
    <div class="tb-right">
      <span id="tb-act" class="tb-chip hidden"></span>
      <span id="tb-gold" class="tb-chip hidden">◉ 0</span>
      <span id="tb-hp" class="tb-chip hidden">❤ 0/0</span>
      <button id="btn-menu" class="icon-btn" title="Menu">☰</button>
    </div>
  </header>

  <!-- TITLE -->
  <section id="screen-title" class="screen">
    <div class="title-block">
      <h1 class="game-title">EMBER<span>DECK</span></h1>
      <p class="tagline">Climb three acts. Burn what stands in the way.</p>
      <div class="title-buttons">
        <button id="btn-newrun" class="big-btn">New Run</button>
        <button id="btn-daily" class="big-btn ghost">Daily Run</button>
        <button id="btn-continue" class="big-btn ghost hidden">Continue</button>
        <button id="btn-howto" class="big-btn ghost">How to Play</button>
      </div>
      <p class="seed-line">seed: <input id="seed-input" placeholder="random" spellcheck="false"></p>
    </div>
  </section>

  <!-- CLASS SELECT -->
  <section id="screen-class" class="screen hidden">
    <h2 class="screen-title">Choose your deck</h2>
    <div id="class-cards" class="class-grid"></div>
  </section>

  <!-- MAP -->
  <section id="screen-map" class="screen hidden">
    <div class="map-head">
      <h2 id="map-act-title" class="screen-title">Act 1</h2>
      <div id="relic-bar" class="relic-bar"></div>
    </div>
    <div id="map-wrap" class="map-wrap"><svg id="map-svg" class="map-svg"></svg><div id="map-nodes" class="map-nodes"></div></div>
    <div id="potions-bar" class="potions-bar"></div>
  </section>

  <!-- COMBAT -->
  <section id="screen-combat" class="screen hidden">
    <div id="combat-field" class="combat-field">
      <div id="enemies-row" class="enemies-row"></div>
      <div id="player-side" class="player-side">
        <div id="player-avatar" class="player-avatar">
          <div id="player-block" class="block-badge hidden"></div>
          <div class="avatar-core"></div>
          <div id="player-buffs" class="buff-row"></div>
        </div>
        <div class="energy-orb" id="energy-orb"><span id="energy-num">3</span></div>
      </div>
      <div id="combat-log" class="combat-log hidden"></div>
      <div id="piles-info" class="piles-info"></div>
    </div>
    <div id="hand" class="hand"></div>
    <div class="combat-controls" id="combat-controls">
      <button id="btn-endturn" class="end-turn-btn">END TURN</button>
    </div>
  </section>

  <!-- REWARD -->
  <section id="screen-reward" class="screen hidden">
    <h2 class="screen-title">Spoils</h2>
    <div id="reward-body" class="reward-body"></div>
  </section>

  <!-- REST / SHOP / EVENT share one generic body each -->
  <section id="screen-rest" class="screen hidden">
    <h2 class="screen-title">Campfire</h2>
    <div id="rest-body" class="center-body"></div>
  </section>

  <section id="screen-shop" class="screen hidden">
    <h2 class="screen-title">Wandering Merchant</h2>
    <div id="shop-body" class="shop-body"></div>
  </section>

  <section id="screen-event" class="screen hidden">
    <h2 class="screen-title" id="event-title"></h2>
    <div id="event-body" class="center-body"></div>
  </section>

  <section id="screen-end" class="screen hidden">
    <div id="end-body" class="center-body"></div>
  </section>

  <!-- MODALS -->
  <div id="modal" class="modal hidden"><div id="modal-body" class="modal-body"></div></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script type="module" src="src/ui/main.js"></script>
</body>
</html>
